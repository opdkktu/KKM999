<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15201C">
<title>Rekod Perjalanan Ambulans</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{ --bg:#15201C; --card:#1D2D28; --ink:#EAF3EF; --mut:#9DB3AA; --line:#2C4239; --acc:#2FAE98; --blue:#1d7fd1; --red:#E6483F; --amber:#F2A93B; }
  *{ box-sizing:border-box } html,body{ height:100%; margin:0 }
  body{ background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .gate{ position:fixed; inset:0; display:grid; place-items:center; padding:20px; background:var(--bg); z-index:50 }
  .gate .box{ width:100%; max-width:340px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:22px }
  input,select{ width:100%; background:#14211D; color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:13px; font-size:16px }
  .btn{ border:0; border-radius:12px; background:var(--acc); color:#06231D; font-weight:800; padding:13px 16px; font-size:15px; cursor:pointer; min-height:48px }
  .btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--ink) }
  #list{ max-width:720px; margin:0 auto; padding:14px 14px 40px }
  .top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px } .top h1{ font-size:18px; margin:0 } .top a{ color:var(--acc); text-decoration:none; font-weight:700; font-size:14px }
  .filters{ display:flex; gap:8px; margin-bottom:12px } .filters select{ width:auto; flex:1 }
  .run{ display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:13px 14px; margin-bottom:10px; cursor:pointer; transition:transform .15s,border-color .2s }
  .run:active{ transform:scale(.98) } .run:hover{ border-color:var(--acc) }
  .run .ic{ font-size:26px } .run .m{ flex:1; min-width:0 } .run .t{ font-weight:700 } .run .s{ font-size:13px; color:var(--mut); margin-top:2px }
  .live{ background:var(--red); color:#fff; font-size:11px; font-weight:800; padding:3px 8px; border-radius:99px; animation:bl 1.2s infinite } @keyframes bl{ 50%{ opacity:.45 } }
  .empty{ text-align:center; color:var(--mut); padding:40px 10px; line-height:1.6 }
  #mapView{ position:fixed; inset:0; display:none; flex-direction:column; background:#000; z-index:20 } #mapView.on{ display:flex }
  #map{ flex:1; min-height:0 }
  .hdr{ position:absolute; top:0; left:0; right:0; z-index:1000; display:flex; gap:8px; align-items:center; padding:calc(10px + env(safe-area-inset-top)) 10px 10px; pointer-events:none }
  .hdr > *{ pointer-events:auto } .pill{ background:rgba(21,32,28,.92); color:var(--ink); border:0; border-radius:999px; padding:10px 14px; font-weight:700; font-size:14px; box-shadow:0 3px 12px rgba(0,0,0,.35); cursor:pointer }
  .hdr .ttl{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .panel{ background:var(--card); border-top:1px solid var(--line); padding:12px 14px calc(14px + env(safe-area-inset-bottom)); }
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; text-align:center; margin-bottom:10px } .stats b{ display:block; font-size:18px; font-variant-numeric:tabular-nums } .stats span{ font-size:11px; color:var(--mut) }
  .ctl{ display:flex; align-items:center; gap:10px } .play{ width:52px; height:52px; border-radius:50%; border:0; background:var(--acc); color:#06231D; font-size:22px; cursor:pointer; flex:none }
  input[type=range]{ flex:1; padding:0; accent-color:var(--acc); height:34px }
  .spd{ display:flex; gap:6px; margin-top:10px; justify-content:center; flex-wrap:wrap } .spd button{ border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:99px; padding:7px 13px; font-weight:700; cursor:pointer } .spd button.on{ background:var(--acc); color:#06231D; border-color:var(--acc) }
  .clock{ text-align:center; font-size:12px; color:var(--mut); margin-bottom:6px }
  .ov{ position:absolute; inset:0; z-index:1500; display:none; place-items:center; background:rgba(0,0,0,.5); color:#fff; font-weight:700 } .ov.on{ display:grid }
  .leaflet-container{ background:#222 }

  /* recap: stage labels, phase chip, notes card, summary */
  .stg{ width:max-content; display:flex; align-items:center; gap:8px; transform:translate(30px,-50%); white-space:nowrap; background:rgba(21,32,28,.94); color:#fff; border-radius:12px; padding:7px 11px 7px 8px; border-left:5px solid var(--c); box-shadow:0 4px 14px rgba(0,0,0,.4); animation:stgIn .45s cubic-bezier(.2,1.3,.3,1) both; font-size:12px; line-height:1.25 }
  .stg b{ font-size:18px } .stg span{ display:block } .stg em{ font-style:normal; color:#9DB3AA; font-size:11px; font-variant-numeric:tabular-nums }
  .stg.old{ opacity:.78; transform:translate(30px,-50%) scale(.9); transform-origin:left center; animation:none }
  @keyframes stgIn{ from{ opacity:0; transform:translate(10px,-50%) scale(.6) } to{ opacity:1; transform:translate(30px,-50%) scale(1) } }
  .phase{ position:absolute; left:50%; top:calc(62px + env(safe-area-inset-top)); transform:translateX(-50%); z-index:1000; background:rgba(21,32,28,.92); color:#fff; padding:8px 16px; border-radius:999px; font-weight:700; font-size:13px; box-shadow:0 3px 12px rgba(0,0,0,.35); transition:opacity .3s; max-width:90%; text-align:center }
  .phase.sw{ animation:ph .5s ease }  @keyframes ph{ from{ transform:translateX(-50%) translateY(-8px); opacity:0 } to{ transform:translateX(-50%); opacity:1 } }
  .notes{ position:absolute; left:10px; right:10px; top:calc(112px + env(safe-area-inset-top)); z-index:1000; background:rgba(21,32,28,.95); color:#EAF3EF; border:1px solid var(--line); border-radius:16px; padding:12px 14px; max-height:24%; overflow:auto; font-size:13px; line-height:1.5; box-shadow:0 6px 20px rgba(0,0,0,.4); animation:up .45s ease both }
  .notes h4{ margin:0 0 6px; font-size:12px; color:var(--acc); letter-spacing:.06em; text-transform:uppercase } .notes .mut{ color:var(--mut); font-style:italic } .notes .cur::after{ content:"▍"; animation:bl 1s infinite }
  @keyframes up{ from{ opacity:0; transform:translateY(16px) } to{ opacity:1; transform:none } }
  .sum{ position:absolute; inset:0; z-index:1800; display:none; align-items:center; justify-content:center; padding:20px; background:radial-gradient(circle at 50% 30%,rgba(21,32,28,.82),rgba(8,14,12,.94)) }
  .sum.on{ display:flex; animation:fade .5s ease both } @keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
  .sum .in{ width:100%; max-width:420px; text-align:center }
  .sum h2{ margin:0 0 4px; font-size:22px; opacity:0; animation:fu .6s .1s ease forwards } .sum .sub{ color:var(--mut); font-size:13px; margin-bottom:18px; opacity:0; animation:fu .6s .2s ease forwards }
  .sum .big{ display:grid; grid-template-columns:1fr 1fr; gap:12px } .sum .box{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px 10px; opacity:0; animation:fu .7s ease forwards }
  .sum .box b{ display:block; font-size:38px; font-variant-numeric:tabular-nums; color:var(--acc); line-height:1.1 } .sum .box span{ font-size:12px; color:var(--mut); letter-spacing:.04em; text-transform:uppercase }
  .sum .box.a{ animation-delay:.45s } .sum .box.b{ animation-delay:.75s }
  .sum .row3{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px } .sum .mini{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 6px; opacity:0; animation:fu .6s ease forwards } .sum .mini b{ display:block; font-size:18px; font-variant-numeric:tabular-nums } .sum .mini span{ font-size:11px; color:var(--mut) }
  .sum .mini:nth-child(1){ animation-delay:1.05s } .sum .mini:nth-child(2){ animation-delay:1.2s } .sum .mini:nth-child(3){ animation-delay:1.35s }
  .sum .acts{ display:flex; gap:10px; margin-top:18px; opacity:0; animation:fu .6s 1.6s ease forwards } .sum .acts .btn{ flex:1 }
  @keyframes fu{ from{ opacity:0; transform:translateY(26px) } to{ opacity:1; transform:none } }
  @media (prefers-reduced-motion:reduce){ .stg,.notes,.sum *,.phase.sw{ animation:none !important; opacity:1 !important } }
  @media (prefers-reduced-motion:reduce){ .live{ animation:none } }
</style>
</head>
<body>
<div class="gate" id="gate"><div class="box">
  <h2 style="margin:0 0 6px">Rekod perjalanan</h2>
  <p style="margin:0 0 14px;color:var(--mut);font-size:14px;line-height:1.5">Masukkan PIN admin (sama seperti laporan penggunaan).</p>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN admin" autocomplete="off">
  <button class="btn" id="go" style="width:100%;margin-top:12px">Buka</button>
  <div id="perr" style="color:var(--red);font-size:13px;margin-top:10px;min-height:18px"></div>
</div></div>

<div id="list" hidden>
  <div class="top"><h1>🚑 Rekod Perjalanan</h1><a href="admin.html">← Laporan</a></div>
  <div class="filters"><select id="days"><option value="7">7 hari</option><option value="30" selected>30 hari</option><option value="90">90 hari</option></select><button class="btn ghost" id="reload">↻ Muat semula</button></div>
  <div id="runs"><div class="empty">Memuatkan…</div></div>
</div>

<div id="mapView">
  <div class="hdr"><button class="pill" id="back">← Senarai</button><div class="pill ttl" id="ttl"></div><button class="pill" id="layer">🛰</button></div>
  <div id="map"></div>
  <div class="phase" id="phase" style="display:none"></div>
  <div class="notes" id="notes" style="display:none"></div>
  <div class="ov" id="ov">Memuatkan trail…</div>
  <div class="sum" id="sum"></div>
  <div class="panel">
    <div class="clock" id="clock">—</div>
    <div class="stats"><div><b id="sKm">0.0</b><span>km</span></div><div><b id="sTime">00:00</b><span>masa</span></div><div><b id="sSpd">0</b><span>km/j</span></div><div><b id="sMax">0</b><span>maks</span></div></div>
    <div class="ctl"><button class="play" id="play" aria-label="Main / jeda">▶</button><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Garis masa"><button class="pill" id="follow">◎</button></div>
    <div class="spd" id="spd"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="amb.js"></script>
<script src="tracks.js"></script>
</body>
</html>
